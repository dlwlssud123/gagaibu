spring:
  threads:
    virtual:
      enabled: true

  datasource:
    url: jdbc:oracle:thin:@localhost:1521/FREE
    driver-class-name: oracle.jdbc.OracleDriver
    username: system
    password: oracle

  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.OracleDialect
        format_sql: true
    show-sql: true

server:
  port: 8080
