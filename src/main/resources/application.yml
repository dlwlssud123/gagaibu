spring:
  threads:
    virtual:
      enabled: true

  datasource:
    url: ${DB_URL:jdbc:oracle:thin:@localhost:1521/FREE}
    driver-class-name: oracle.jdbc.OracleDriver
    username: ${DB_USERNAME:system}
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.OracleDialect
        format_sql: true
    show-sql: true

nvidia:
  nim:
    api-key: ${NVIDIA_API_KEY}
    model: ${NVIDIA_MODEL:nvidia/nemotron-3-ultra-550b-a55b}

server:
  port: 8080
